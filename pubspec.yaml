name: talabak_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+24

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.8.1
  google_maps_flutter: ^2.14.2
  geolocator: 14.0.2
  geocoding: ^4.0.0
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  http: ^1.2.1
  font_awesome_flutter: ^10.7.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_staggered_animations: ^1.0.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  awesome_notifications: ^0.11.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  google_sign_in: ^7.2.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  cached_video_player_plus: ^4.1.0
  video_player: ^2.8.2
  audioplayers: ^6.6.0
  sqflite: 2.3.3+1
  share_plus: ^12.0.2
  app_links: ^6.4.1
  crypto: ^3.0.7
  flutter_spinkit: ^5.2.1
  connectivity_plus: ^7.1.1
  internet_connection_checker_plus: ^3.0.0
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  sqflite: 2.3.3+1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding1.png
    - assets/images/onboarding2.png
    - assets/images/onboarding3.png
    - assets/images/onboarding4.png
    - assets/images/onboarding5.png
    - assets/images/google_logo.png
    - assets/images/app_logo.png
    - assets/images/marker_icon.png
    - assets/images/store_pin.png
    - assets/images/app_icon_pin.png
    - assets/images/sub_area_pin_gold.png
    - assets/images/ultimate_full_bleed.png
    - assets/images/Golden _T_ with flame design.png
    - assets/sounds/
