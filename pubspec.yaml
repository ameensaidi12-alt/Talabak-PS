name: talabak_app
description: "Talabak PS - Premium multi-vendor delivery service built with Flutter and Supabase."
publish_to: 'none'

version: 1.0.0+28

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  supabase_flutter: ^2.0.2
  google_sign_in: ^7.2.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.6.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  awesome_notifications: ^0.11.0
  webview_flutter: ^4.7.0
  package_info_plus: ^9.0.0
  uuid: ^4.5.3
  cached_video_player_plus: ^4.1.0
  video_player: ^2.8.2
  audioplayers: ^6.6.0
  sqflite: ^2.4.2
  share_plus: ^12.0.2
  app_links: ^6.4.1
  crypto: ^3.0.7
  connectivity_plus: ^7.1.1
  internet_connection_checker_plus: ^3.0.0
  font_awesome_flutter: ^10.9.1
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/store_pin.png
    - assets/images/app_icon_pin.png
    - assets/images/sub_area_pin_gold.png
    - assets/images/ultimate_full_bleed.png
    - assets/images/Golden _T_ with flame design.png
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Golden _T_ with flame design.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/images/Golden _T_ with flame design.png"
