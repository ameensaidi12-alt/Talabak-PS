<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talabak PS | شروط الاستخدام</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Motion -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFD700',
                        dark: '#0A0A0A',
                        card: 'rgba(255, 255, 255, 0.03)',
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0A0A0A;
            color: white;
            -webkit-font-smoothing: antialiased;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gold-gradient {
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-border {
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0A0A0A;
        }

        ::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 10px;
        }
    </style>
</head>

<body class="font-cairo selection:bg-primary/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = Motion;

        const LegalPage = () => {
            const [content, setContent] = useState(null);
            const [loading, setLoading] = useState(true);
            const slug = 'terms';

            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const response = await fetch(`https://ylpjqejnvhaqbdssjaof.supabase.co/functions/v1/legal?slug=${slug}`, {
                            headers: { 'Accept': 'application/json' }
                        });
                        const data = await response.json();
                        setContent(data);
                    } catch (error) {
                        console.error("Fetch error:", error);
                    } finally {
                        setLoading(false);
                    }
                };
                fetchData();
            }, []);

            if (loading) {
                return (
                    <div className="flex h-screen w-screen items-center justify-center bg-dark">
                        <motion.div
                            animate={{ rotate: 360 }}
                            transition={{ repeat: Infinity, duration: 1, ease: "linear" }}
                            className="h-12 w-12 border-4 border-primary/20 border-t-primary rounded-full"
                        />
                    </div>
                );
            }

            return (
                <div className="min-h-screen relative overflow-hidden pb-20">
                    {/* Background Ambient Light */}
                    <div className="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px]" />
                    <div className="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/3 rounded-full blur-[120px]" />

                    <nav className="fixed top-0 left-0 right-0 z-50 glass py-4 px-6 md:px-20 flex justify-between items-center">
                        <motion.div
                            initial={{ x: -20, opacity: 0 }}
                            animate={{ x: 0, opacity: 1 }}
                            className="text-2xl font-black gold-gradient tracking-tighter"
                        >
                            TALABAK PS
                        </motion.div>
                        <div className="flex gap-4">
                            <span className="text-xs text-white/40 uppercase tracking-widest hidden md:block">Terms of Service</span>
                        </div>
                    </nav>

                    <main className="container mx-auto px-6 pt-32 max-w-4xl relative">
                        <motion.div
                            initial={{ y: 30, opacity: 0 }}
                            animate={{ y: 0, opacity: 1 }}
                            transition={{ delay: 0.2 }}
                            className="mb-12 text-center"
                        >
                            <h1 className="text-5xl md:text-7xl font-black mb-6 gold-gradient leading-tight">
                                {content?.title || "شروط الاستخدام"}
                            </h1>
                            <div className="h-1 w-24 bg-primary mx-auto rounded-full shadow-[0_0_15px_rgba(255,215,0,0.5)]" />
                        </motion.div>

                        <motion.div
                            initial={{ y: 40, opacity: 0 }}
                            animate={{ y: 0, opacity: 1 }}
                            transition={{ delay: 0.4 }}
                            className="glass p-8 md:p-12 rounded-[40px] gold-border relative group"
                        >
                            <div className="absolute top-0 left-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                                <i data-lucide="scroll-text" className="w-16 h-16 text-primary"></i>
                            </div>

                            <article
                                className="prose prose-invert prose-gold max-w-none text-white/80 leading-relaxed text-lg"
                                dangerouslySetInnerHTML={{ __html: content?.html?.match(/<div class="content-card">([\s\S]*?)<\/div>/)?.[1] || content?.html || "المحتوى غير متوفر" }}
                            />
                        </motion.div>

                        <motion.footer
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            transition={{ delay: 0.6 }}
                            className="mt-16 text-center space-y-4"
                        >
                            <p className="text-white/40">آخر تحديث: {new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                            <div className="flex justify-center gap-6">
                                <a href="https://mediumorchid-lark-605198.hostingersite.com/" className="text-primary hover:text-white transition-colors text-sm">سياسة الخصوصية</a>
                                <div className="w-1 h-1 bg-white/20 rounded-full my-auto" />
                                <span className="text-white/20 text-sm">تطبيق طلبك بي أس © {new Date().getFullYear()}</span>
                            </div>
                        </motion.footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LegalPage />);

        // Render lucide icons after a short delay
        setTimeout(() => {
            lucide.createIcons();
        }, 1000);
    </script>
</body>

</html>
