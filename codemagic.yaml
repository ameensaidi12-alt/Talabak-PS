workflows:
  ios-build:
    name: Talabak iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      # 🔥 Fix 3: Downgrade to 1.15.2 as recommended
      cocoapods: 1.15.2
    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Fix CocoaPods and install
        script: |
          # Ensure correct CocoaPods version
          sudo gem install cocoapods -v 1.15.2 --no-document
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
