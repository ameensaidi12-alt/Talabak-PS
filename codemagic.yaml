workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: 1.16.2
    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Fix pods and install
        script: |
          git config --global advice.detachedHead false
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
